name: Validate Main H5 UX

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  push:
    branches: [main]
  schedule:
    - cron: '15 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r1-main-repeat-ui:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[L3-H5]'))
    # Nightly/manual or explicitly marked high-risk PR Mock regression; real Production reads
    # and device UX remain separate manual acceptance gates.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_XLINK_ENABLE_REAL_WRITES: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify credential-free Production repeat panel interaction
        run: pnpm run test:r1-main-repeat-ui
      # Draft PRs intentionally skip the broader L3 H5 UX job below. Exercise
      # this fully synthetic, deny-external-network closure on the same browser
      # already installed for the repeat panel, so Draft cannot appear green
      # without the actual form → Workflow → commercial navigation working.
      - name: Verify DEV Mock saved-form to commercial handoff at two mobile widths
        run: pnpm exec playwright test --config config/playwright/main-h5-mock.config.ts tests/h5-main-mock/mock-business-closure.spec.ts
      - name: Preserve Draft Mock closure trace and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-mock-business-closure-${{ github.run_id }}
          path: test-results/main-h5-mock/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify A-stage P1 forms, repeat and priced Mock Order in real H5 at both mobile widths
        env:
          VITE_XLINK_R1_MP_UX_FIXTURES: 'true'
        run: pnpm exec playwright test --config config/playwright/main-h5-mock.config.ts tests/h5-main-mock/a-stage-p1-acceptance.spec.ts
      - name: Preserve A-stage P1 H5 interaction traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-a-stage-p1-h5-${{ github.run_id }}
          path: test-results/main-h5-mock/
          if-no-files-found: warn
          retention-days: 7

  stage1b-mock-h5:
    # Stage 1B source-specific Process is an automatic main-HEAD browser gate,
    # while the broader L3/Owner/device visual acceptance remains separate.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[FORM-BATCH]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_XLINK_R1_MP_UX_FIXTURES: 'true'
      VITE_XLINK_ENABLE_REAL_WRITES: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify Stage 1B/2A and 020/021 CRUD at 375/390/430 (one browser boot)
        run: >-
          pnpm exec playwright test --config config/playwright/main-h5-mock.config.ts
          tests/h5-main-mock/stage1b-r1-forms-after-save.spec.ts
          tests/h5-main-mock/stage2a-r1-multifield.spec.ts
          tests/h5-main-mock/a-stage-p1-acceptance.spec.ts
          tests/h5-main-mock/dynamic-field-registry.spec.ts
          --grep 'Stage 1B|Stage 2A|020 forms|021 repeat|Field registry'
      - name: Verify deferred appointment retains its existing datetime in the real App
        run: pnpm exec playwright test --config config/playwright/main-h5-mock.config.ts tests/h5-main-mock/deferred-appointment-r1.spec.ts
      - name: Verify Stage 2B optional typed primitives on source-shaped Mock FormDef
        env:
          VITE_XLINK_R1_STAGE2B_FIELDS: 'true'
        run: pnpm exec playwright test --config config/playwright/main-h5-mock.config.ts tests/h5-main-mock/stage2b-r1-primitive-fields.spec.ts
      - name: Verify Stage 2C R1 checkbox/cascade arrays on the real App
        env:
          VITE_XLINK_R1_STAGE2C_ARRAYS: 'true'
        run: pnpm exec playwright test --config config/playwright/main-h5-mock.config.ts tests/h5-main-mock/stage2c-r1-array-fields.spec.ts
      - name: Verify real GenericDynamicFormActionContent scalar preview and write fence at 430
        env:
          VITE_XLINK_DYNAMIC_SCALAR_QA: 'true'
        run: pnpm exec playwright test --config config/playwright/main-h5-mock.config.ts tests/h5-main-mock/dynamic-form-scalar-closure.spec.ts
      - name: Verify offline drafts, persistent media recovery and temporal records at 430
        env:
          VITE_XLINK_R1_STAGE2D_FIELDS: 'true'
        run: >-
          pnpm exec playwright test --config config/playwright/main-h5-mock.config.ts
          tests/h5-main-mock/stage2d-r1-temporal-fields.spec.ts
          tests/h5-main-mock/weak-network-recovery.spec.ts
          tests/h5-main-mock/m3-survey-media-430.spec.ts
          tests/h5-main-mock/media-interrupted-receipt.spec.ts
      - name: Verify three-level cascade record roundtrip
        env:
          VITE_XLINK_R1_DEEP_CASCADE: 'true'
        run: pnpm exec playwright test --config config/playwright/main-h5-mock.config.ts tests/h5-main-mock/deep-cascade-record.spec.ts
      - name: Verify special business-record Provider transactions
        env:
          VITE_XLINK_R1_BUSINESS_FIELDS: 'true'
        run: pnpm exec playwright test --config config/playwright/main-h5-mock.config.ts tests/h5-main-mock/special-business-record.spec.ts
      - name: Verify Stage A generic R1 file queue and stale-editor H5 acceptance
        env:
          VITE_XLINK_R1_SPECIAL_MEDIA: 'true'
        run: pnpm exec playwright test --config config/playwright/main-h5-mock.config.ts tests/h5-main-mock/a-stage-last-two.spec.ts
      - name: Verify default Mock quotation fields, cross-tab drafts and Quote to Order readback at 430
        run: pnpm exec playwright test --config config/playwright/main-h5-mock.config.ts tests/h5-main-mock/order-fields-flow.spec.ts
      - name: Verify M08 synthetic catalog pagination and package quotation at 430
        env:
          VITE_XLINK_R1_CATALOG_SCALE: 'true'
        run: pnpm exec playwright test --config config/playwright/catalog-scale.config.ts
      - name: Verify synchronous AppInput delivery and H5 native boundaries
        run: pnpm exec playwright test --config config/playwright/input-delivery.config.ts
      - name: Verify rapid search delivery on button and keyboard entry
        run: pnpm exec playwright test --config config/playwright/search-delivery.config.ts
      - name: Preserve Stage 1B/2A/2B/2C offline H5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1b-main-h5-${{ github.run_id }}
          path: |
            test-results/main-h5-mock/
            test-results/m08-catalog-scale/
            test-results/input-delivery/
            test-results/search-delivery/
          if-no-files-found: warn
          retention-days: 7

  h5-ux:
    # L3 nightly/manual or explicitly marked high-risk PR; ordinary PR/main events keep a skipped check context.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[L3-H5]'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_XLINK_ENABLE_REAL_WRITES: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build main App H5 bundle (prevent runtime entry regressions)
        run: pnpm run build:h5

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install headless Chromium for real H5 bootstrap smoke
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify real main App H5 mounts Login without auth or external API
        run: pnpm run test:main-h5-boot

      - name: Verify REAL main App quotation using credential-free isolated DEV Mock
        run: pnpm run test:main-h5-mock

      # Must run even if browser startup, assertions or the network guard fail.
      # No Production identity, request payload or authentication material is
      # ever used by this test. The artifact is the durable QA handoff.
      - name: Preserve main-App Mock QA report and Playwright trace on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-h5-mock-qa-${{ github.run_id }}
          path: test-results/main-h5-mock/
          if-no-files-found: warn
          retention-days: 7

      - name: Verify G4-F legacy H5 review UX remains compatible
        run: pnpm run test:uni-h5-g4f-review

      - name: Preserve legacy G4-F H5 regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4f-h5-review-${{ github.run_id }}
          path: |
            test-results/
            .review/g4f-commercial-mock-ux/generated/
          if-no-files-found: warn
          retention-days: 7

