name: Validate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VITE_XLINK_ENABLE_REAL_WRITES: 'false'
    steps:
      - name: Check out PR source
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Boundary, UI governance, baseline and type checks
        env:
          VITE_XLINK_ENVIRONMENT: test
        run: |
          pnpm run check:boundaries
          pnpm run check:engineering-ownership
          pnpm run check:critical
          pnpm run check:ui-governance
          pnpm run check:m1-i8-baseline
          pnpm run typecheck
      - name: Fast actor, read-only, quotation and changed Vitest tests
        env:
          VITE_XLINK_ENVIRONMENT: test
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          mapfile -t changed_tests < <(git diff --name-only "$BASE_SHA" HEAD -- ':(glob)tests/**/*.test.ts')
          printf 'Changed Vitest test files: %s\n' "${#changed_tests[@]}"
          pnpm exec vitest run \
            tests/g4f/production-read-only.test.ts \
            tests/g4f/quotation-order-read.test.ts \
            tests/g4f/quotation-order-reconstruction.test.ts \
            tests/g4f/quotation-order-signing-read-boundary.test.ts \
            tests/engineering/r1-action-workspace-foundation.test.ts \
            tests/engineering/eq07-command-state-consistency.test.ts \
            tests/g4d/action-workspace.test.ts \
            "${changed_tests[@]}"


  verify:
    # Run full tests and platform builds only on main push or manual dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_XLINK_ENABLE_REAL_WRITES: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Several pinned engineering-gate tests inspect ancestry and compare
          # exact historical commits; the default shallow checkout omits them.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify boundaries, types, and tests
        env:
          # Test-only synthetic Mock contract. Never inherited by bundle builds.
          VITE_XLINK_ENVIRONMENT: test
        run: pnpm run verify

      - name: Build WeChat Mini Program bundle
        run: pnpm run build:mp-weixin

      - name: Build uni-app native bundle
        run: pnpm run build:app
