name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_XLINK_ENABLE_REAL_WRITES: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify boundaries, types, and tests
        env:
          # Test-only synthetic Mock contract. Never inherited by bundle builds.
          VITE_XLINK_ENVIRONMENT: test
        run: pnpm run verify

      - name: Build WeChat Mini Program bundle
        run: pnpm run build:mp-weixin

      - name: Build uni-app native bundle
        run: pnpm run build:app
