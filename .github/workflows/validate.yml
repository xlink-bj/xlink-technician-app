name: Validate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    if: github.event_name == 'pull_request'
    outputs:
      ci_workflow_changed: ${{ steps.changed_tests.outputs.ci_workflow_changed }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VITE_XLINK_ENABLE_REAL_WRITES: 'false'
    steps:
      - name: Check out PR source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Boundary, UI ownership and type checks
        env:
          VITE_XLINK_ENVIRONMENT: test
        run: |
          pnpm run check:boundaries
          pnpm run check:engineering-ownership
          pnpm run check:critical
          pnpm run check:ui-governance
          pnpm run typecheck
      - name: Critical baseline and affected Vitest tests
        id: changed_tests
        env:
          VITE_XLINK_ENVIRONMENT: test
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA"
          node --input-type=module <<'JS'
          import { execFileSync, spawnSync } from 'node:child_process'
          import { appendFileSync, existsSync } from 'node:fs'

          const base = process.env.BASE_SHA
          if (!/^[0-9a-f]{40}$/.test(base)) throw new Error('Invalid PR base SHA')
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' })
          git('cat-file', '-e', `${base}^{commit}`)
          const diff = (...args) => git('diff', '-z', ...args, base, 'HEAD').split('\0').filter(Boolean)
          const current = new Set(diff('--name-only', '--diff-filter=ACMR', '--find-renames', '--find-copies'))
          const tokens = diff('--name-status', '--find-renames', '--find-copies')
          const changes = []
          for (let i = 0; i < tokens.length;) {
            const status = tokens[i++]
            const previous = /^[RC]/.test(status) ? tokens[i++] : undefined
            const path = tokens[i++]
            if (!path) throw new Error('Incomplete Git change record')
            changes.push({ status, previous, path })
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `ci_workflow_changed=${changes.some(c => [c.previous, c.path].some(p => p?.startsWith('.github/workflows/')))}\n`)
          const baseline = [
            'tests/g4f/production-read-only.test.ts',
            'tests/g4f/quotation-order-read.test.ts',
            'tests/g4f/quotation-order-reconstruction.test.ts',
            'tests/g4f/quotation-order-signing-read-boundary.test.ts',
            'tests/engineering/r1-action-workspace-foundation.test.ts',
            'tests/engineering/action-command-revision-consistency.test.ts',
            'tests/g4d/action-workspace.test.ts',
          ]
          for (const path of baseline) if (!existsSync(path)) throw new Error(`Missing critical baseline: ${path}`)
          const isTest = p => p.startsWith('tests/') && p.endsWith('.test.ts')
          const kind = p => isTest(p) ? 'test'
            : p.endsWith('.md') && (p.startsWith('docs/') || !p.includes('/') || p === 'scripts/README.md') ? 'documentation' : 'other'
          const changedTests = [...current].filter(p => isTest(p) && existsSync(p))
          console.log('Git changes:', changes)
          console.log('Existing added/modified/copied/renamed tests:', changedTests)
          const selected = new Set([...baseline, ...changedTests])
          let fullReason = ''
          for (const { status, previous, path } of changes) {
            if (previous && kind(previous) !== kind(path)) {
              fullReason ||= `cross-category rename/copy: ${previous} -> ${path}`
            } else if (kind(path) === 'documentation') continue
            else if (/^[ACMR]/.test(status) && kind(path) === 'test' && current.has(path) && existsSync(path)) continue
            else fullReason ||= `source, configuration, fixture, deleted test or unknown change: ${path}`
          }
          // Empty/doc-only changes run the baseline; deletion and unknown scope
          // run all unit tests. Never pass removed/old rename paths to Vitest.
          console.log(fullReason ? `Full unit suite: ${fullReason}` : `Baseline and surviving changed tests (${selected.size}):`, fullReason ? '' : [...selected])
          const result = spawnSync('pnpm', ['exec', 'vitest', 'run', ...(fullReason ? [] : selected)], { stdio: 'inherit' })
          if (result.error) throw result.error
          process.exitCode = result.status ?? 1
          JS


  verify:
    # Full gate on main/manual and CI-workflow-changing PRs; other PRs keep the fast lane.
    needs: quick
    if: ${{ always() && (github.event_name != 'pull_request' || (needs.quick.result == 'success' && needs.quick.outputs.ci_workflow_changed == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_XLINK_ENABLE_REAL_WRITES: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Several pinned engineering-gate tests inspect ancestry and compare
          # exact historical commits; the default shallow checkout omits them.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify boundaries, types, and tests
        env:
          # Test-only synthetic Mock contract. Never inherited by bundle builds.
          VITE_XLINK_ENVIRONMENT: test
        run: pnpm run verify

      - name: Build H5 bundle
        run: pnpm run build:h5

      - name: Build WeChat Mini Program bundle
        run: pnpm run build:mp-weixin

      - name: Build uni-app native bundle
        run: pnpm run build:app
