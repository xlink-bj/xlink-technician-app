name: EQ08 P1 Form and Command Architecture (NO business writes)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/features/work-orders/action-form-schema.ts'
      - 'src/features/work-orders/appointment-form-runtime.ts'
      - 'src/features/work-orders/dynamic-form-action.ts'
      - 'src/adapters/api/action-command-wires.ts'
      - 'src/adapters/api/technician-api-commands.ts'
      - 'tests/engineering/eq08-action-architecture.test.ts'
      - 'tests/engineering/r1-appointment-conditional-runtime.test.ts'
      - 'docs/engineering/EQ08_P1_ARCHITECTURE_BOUNDARIES.md'
      - '.github/workflows/eq08-architecture-boundary-gate.yml'
permissions:
  contents: read
jobs:
  source-contract-and-builds:
    if: github.event.pull_request.draft == true && github.event.pull_request.head.ref == 'engineering/eq08-p1-form-command-boundaries'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      VITE_XLINK_ENVIRONMENT: test
      VITE_XLINK_ENABLE_REAL_WRITES: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact EQ07 parent and scope, forbid snapshot & lock changes
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 934cca0c8aa5bd92fbb1317cd056c90eebc8b93e HEAD
          git diff --name-only 934cca0c8aa5bd92fbb1317cd056c90eebc8b93e HEAD | sort > /tmp/actual
          printf '%s\n' '.github/workflows/eq08-architecture-boundary-gate.yml' 'docs/engineering/EQ08_P1_ARCHITECTURE_BOUNDARIES.md' 'src/adapters/api/action-command-wires.ts' 'src/adapters/api/technician-api-commands.ts' 'src/features/work-orders/action-form-schema.ts' 'src/features/work-orders/appointment-form-runtime.ts' 'src/features/work-orders/dynamic-form-action.ts' 'tests/engineering/eq08-action-architecture.test.ts' 'tests/engineering/r1-appointment-conditional-runtime.test.ts' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: P1 architecture parity plus existing R1 source contracts
        run: |
          pnpm exec vitest run \
            tests/engineering/eq08-action-architecture.test.ts \
            tests/engineering/r1-appointment-conditional-runtime.test.ts \
            tests/engineering/r1-appointment-wire-unification.test.ts \
            tests/engineering/eq07-command-state-consistency.test.ts \
            tests/g4d/appointment-action-content.test.ts \
            tests/g4d/accept-appointment.test.ts \
            tests/g4e/onsite-inspection.test.ts \
            tests/g4f/quotation-order-submission.test.ts
      - run: pnpm verify:critical
      - run: pnpm verify:full
      - run: pnpm build:h5 && pnpm build:mp-weixin && pnpm build:app
  main-mock-journey-and-original-goldens:
    if: github.event.pull_request.draft == true && github.event.pull_request.head.ref == 'engineering/eq08-p1-form-command-boundaries'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VITE_XLINK_ENABLE_REAL_WRITES: 'false'
      H5_VISUAL_OWNER_APPROVAL: 'PENDING'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - run: pnpm exec playwright test --config config/playwright/main-h5-mock.config.ts tests/h5-main-mock/m1-i7-six-stage-integration.spec.ts
      - run: pnpm test:ds02a:gallery
      - run: pnpm test:ds02a:business
