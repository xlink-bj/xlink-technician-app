name: Validate Main H5 Smoke

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-h5-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init
    defaults:
      run:
        shell: bash
    env:
      VITE_XLINK_ENABLE_REAL_WRITES: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-playwright-runtime.mjs
      - name: Verify focused real App H5 interactions
        run: pnpm run test:main-h5-smoke
      - name: Preserve smoke reports and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-h5-smoke-${{ github.run_id }}
          path: |
            test-results/main-h5-smoke/
            test-results/main-h5-mock/
            test-results/input-delivery/
            test-results/search-delivery/
            test-results/brand-h5/
          if-no-files-found: warn
          retention-days: 7
