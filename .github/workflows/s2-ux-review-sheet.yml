name: S2 UX Review Sheet

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'tests/s2-ux-review/**'
      - 'playwright.s2-ux-review.config.ts'
      - 'scripts/check-s2-ux-review.mjs'
      - '.github/workflows/s2-ux-review-sheet.yml'
      - 'src/pages/**'
      # UI source files; feature-local TypeScript helpers use fast unit CI.
      - 'src/features/work-orders/**/*.vue'
      - 'src/features/work-orders/**/*.scss'
      - 'src/features/work-orders/**/*.css'
      # Shared visual anatomy is rendered throughout Q00–Q03 and S01.
      - 'src/shared/ui/**'
      - 'src/components/**'
      - 'src/styles/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-main-app:
    # L3 50-frame evidence: Ready PR only; Draft commits skip this job.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_XLINK_ENABLE_REAL_WRITES: 'false'
    steps:
      - name: Check out exact PR source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frozen application dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium and Chinese labels font
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk

      - name: Capture real uni-app H5 mobile UX states and assemble sheets
        run: pnpm run capture:s2-ux-sheet

      - name: Verify both review-sheet evidence bundles
        run: pnpm run check:s2-ux-sheet

      # Upload both successes and partial/failure states. Screens are DEV-only
      # and all external HTTP requests are fail-closed before navigation.
      - name: Publish screenshot sheets and review manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-main-app-review-sheets-${{ github.run_id }}
          path: |
            .review/m1-s2/generated/
            test-results/s2-ux-review/
          if-no-files-found: warn
          retention-days: 30
