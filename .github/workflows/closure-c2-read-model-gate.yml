name: Closure C2 — Isolated Action Read Model (NO business writes)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/closure-c2-read-model-gate.yml'
      - 'docs/engineering/CLOSURE_C2_READ_MODEL_REFACTOR.md'
      - 'scripts/check-closure-c1-integration.mjs'
      - 'src/features/work-orders/action-workspace.ts'
      - 'src/features/work-orders/action-workspace-read-model.ts'
      - 'tests/engineering/closure-c2-read-model.test.ts'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  read-model-and-cross-platform:
    if: github.event.pull_request.draft == true && github.event.pull_request.head.ref == 'engineering/closure-c2-action-read-model'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VITE_XLINK_ENVIRONMENT: test
      VITE_XLINK_ENABLE_REAL_WRITES: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verified Closure C1 base and exactly scoped six files
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor ac715c96c36af1fe6caa4fc7be1a6bf092358aa3 HEAD
          git diff --name-only ac715c96c36af1fe6caa4fc7be1a6bf092358aa3 HEAD | sort > /tmp/actual
          printf '%s\n' '.github/workflows/closure-c2-read-model-gate.yml' 'docs/engineering/CLOSURE_C2_READ_MODEL_REFACTOR.md' 'scripts/check-closure-c1-integration.mjs' 'src/features/work-orders/action-workspace.ts' 'src/features/work-orders/action-workspace-read-model.ts' 'tests/engineering/closure-c2-read-model.test.ts' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          test "$(git diff --name-only ac715c96c36af1fe6caa4fc7be1a6bf092358aa3 HEAD -- src/adapters/ src/runtimes/ src/shared/ pnpm-lock.yaml tests/ds02a-main/snapshots tests/ds02a-gallery/snapshots | wc -l)" -eq 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read-only projections, original Workspace and cross-stage regressions
        run: |
          pnpm exec vitest run \
            tests/engineering/closure-c2-read-model.test.ts \
            tests/g4d/action-workspace.test.ts \
            tests/engineering/eq07-command-state-consistency.test.ts \
            tests/engineering/eq08-action-architecture.test.ts \
            tests/engineering/r1-appointment-conditional-runtime.test.ts \
            tests/engineering/r1-catalog-price-identity-fence.test.ts \
            tests/g4f/quotation-order-submission.test.ts \
            tests/engineering/eq10-governance.test.ts \
            tests/engineering/closure-c1-integration.test.ts
      - name: Source ownership, extended critical behavior and full baseline
        run: |
          pnpm check:engineering-ownership
          pnpm verify:critical
          pnpm verify:full
      - name: Non-test H5, WeChat MP and native App bundles
        run: pnpm build:h5 && pnpm build:mp-weixin && pnpm build:app
  mock-and-original-visual-goldens:
    if: github.event.pull_request.draft == true && github.event.pull_request.head.ref == 'engineering/closure-c2-action-read-model'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VITE_XLINK_ENVIRONMENT: test
      VITE_XLINK_ENABLE_REAL_WRITES: 'false'
      H5_VISUAL_OWNER_APPROVAL: 'PENDING'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Original H5 six-stage Mock user path
        run: pnpm exec playwright test --config config/playwright/main-h5-mock.config.ts tests/h5-main-mock/m1-i7-six-stage-integration.spec.ts
      - name: Approved Gallery Golden (no snapshot update)
        run: pnpm test:ds02a:gallery
      - name: Approved Business Golden (no snapshot update)
        run: pnpm test:ds02a:business
