name: DS07 C4B Real H5 Evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/features/work-orders/quotation/QuotationOrderHub.vue'
      - 'src/features/work-orders/quotation/QuotationActionWorkspace.vue'
      - 'src/pages/work-orders/signing-order-read.vue'
      - 'tests/h5-main-mock/ds07c4b-quote-signing.spec.ts'
      - 'tests/h5-main-mock/ds07c4b-signing-state-visual.spec.ts'
      - '.github/workflows/ds07c4b-h5-evidence.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quote-signing-h5:
    if: github.event.pull_request.head.ref == 'design-system/ds07c4b-quote-signing-notice'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITE_XLINK_ENABLE_REAL_WRITES: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:ui-governance
      - run: pnpm run typecheck
      - run: pnpm run build:h5
      - name: Install headless Chromium and Chinese fonts
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Actual H5 Quote and Signing safety contract
        run: pnpm exec playwright test --config config/playwright/main-h5-mock.config.ts tests/h5-main-mock/ds07c4b-quote-signing.spec.ts tests/h5-main-mock/ds07c4b-signing-state-visual.spec.ts
      - name: Preserve real screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ds07-c4b-actual-h5-${{ github.run_id }}
          path: test-results/main-h5-mock/
          retention-days: 30
          if-no-files-found: warn
