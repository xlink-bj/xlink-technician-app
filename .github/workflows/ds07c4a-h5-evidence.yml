name: DS07 C4A Real H5 Evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/shared/ui/AppActionContentHeading.vue'
      - 'src/features/work-orders/components/GenericDynamicFormActionContent.vue'
      - 'src/features/work-orders/components/SurveyLeakageCauseExperience.vue'
      - 'src/features/work-orders/components/SurveyTaskSectionHeading.vue'
      - 'src/pages/work-orders/action-workspace.vue'
      - 'tests/h5-main-mock/main-app-quotation.spec.ts'
      - '.github/workflows/ds07c4a-h5-evidence.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actual-appointment-survey:
    # Temporary, narrow visual evidence gate for stacked Draft #158.
    # This is deliberately executable on a Draft PR; no credentials or real writes.
    if: github.event.pull_request.head.ref == 'design-system/ds07c4a-appointment-survey-migration'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITE_XLINK_ENABLE_REAL_WRITES: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify actual App H5 bundle
        run: pnpm run build:h5
      - name: Install Playwright Chromium and deterministic CJK fonts
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify real Appointment and Survey and continuous Mock workflow
        run: pnpm exec playwright test --config playwright.main-h5-mock.config.ts --grep 'DS-07.C4.A|shared Action Workspace displays|one MOCK-019 WorkOrder progresses'
      - name: Preserve actual screenshots, traces, and full test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ds07-c4a-actual-h5-${{ github.run_id }}
          path: test-results/main-h5-mock/
          if-no-files-found: warn
          retention-days: 30
