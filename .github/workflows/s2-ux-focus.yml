name: M1 S2 Focus Screenshot

on:
  pull_request:
    paths:
      - '.github/workflows/s2-ux-focus.yml'
      - 'config/playwright/s2-ux-focus.config.ts'
      - 'tests/s2-ux-focus/**'
      - 'src/features/work-orders/quotation/QuotationOrderHub.vue'
      - 'src/features/work-orders/quotation/QuotationActionContent.vue'
      - 'src/features/work-orders/quotation/QuotationActionWorkspace.vue'
      - 'src/pages/work-orders/detail.vue'
      - 'src/features/work-orders/WorkOrderTaskFocus.vue'
  workflow_dispatch:
    inputs:
      screen:
        description: One actual main-App mobile scene to inspect
        type: choice
        required: true
        default: Q00
        options:
          - Q00
          - Q01
          - Q03
          - C01
          - DETAIL

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_XLINK_ENABLE_REAL_WRITES: 'false'
      # PR validates all entry points once; manual runs select just one page.
      S2_FOCUS_SCREEN: ${{ github.event_name == 'pull_request' && 'ALL' || inputs.screen || 'Q00' }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install browser and Chinese font
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk

      - name: Capture chosen real main-App H5 scene only
        run: pnpm exec playwright test --config config/playwright/s2-ux-focus.config.ts

      - name: Preserve focused screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-s2-focused-${{ github.run_id }}
          path: |
            .review/m1-s2/focus/
            test-results/s2-ux-focus/
          if-no-files-found: warn
          retention-days: 14
