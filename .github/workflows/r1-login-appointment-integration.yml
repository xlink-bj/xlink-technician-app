name: R1 Login + Appointment Integrated Candidate (NO release)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/r1-login-appointment-integration.yml'
      - 'docs/engineering/R1_LOGIN_APPOINTMENT_RECONCILIATION.md'
      - 'src/adapters/api/technician-api-commands.ts'
      - 'tests/engineering/r1-appointment-wire-unification.test.ts'
      - 'docs/engineering/R1_APPOINTMENT_SAVE_WIRE_UNIFICATION.md'
      - '.github/workflows/r1-appointment-wire.yml'
permissions:
  contents: read
jobs:
  exact-ancestry-and-combined-contract:
    if: github.event.pull_request.draft == true && github.event.pull_request.head.ref == 'engineering/r1-login-appointment-integrated-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VITE_XLINK_ENVIRONMENT: test
      VITE_XLINK_ENABLE_REAL_WRITES: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify both feature parents and six new paths only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-list --parents -n 1 c383a642485e609e52a9110efb91c10938e30025)" = "c383a642485e609e52a9110efb91c10938e30025 f7ee7360e302d576dd4a44164592b5bcdf2c1b0e 18ae65d85713cadc40cc00b87a44d3dba90ffdeb"
          git merge-base --is-ancestor f7ee7360e302d576dd4a44164592b5bcdf2c1b0e HEAD
          git merge-base --is-ancestor 18ae65d85713cadc40cc00b87a44d3dba90ffdeb HEAD
          git diff --name-only f7ee7360e302d576dd4a44164592b5bcdf2c1b0e HEAD | sort > /tmp/r1-actual
          printf '%s\n' '.github/workflows/r1-appointment-wire.yml' '.github/workflows/r1-login-appointment-integration.yml' 'docs/engineering/R1_APPOINTMENT_SAVE_WIRE_UNIFICATION.md' 'docs/engineering/R1_LOGIN_APPOINTMENT_RECONCILIATION.md' 'src/adapters/api/technician-api-commands.ts' 'tests/engineering/r1-appointment-wire-unification.test.ts' | sort > /tmp/r1-expected
          diff -u /tmp/r1-expected /tmp/r1-actual
          for path in src/adapters/api/technician-api-commands.ts tests/engineering/r1-appointment-wire-unification.test.ts docs/engineering/R1_APPOINTMENT_SAVE_WIRE_UNIFICATION.md .github/workflows/r1-appointment-wire.yml; do
            test "$(git rev-parse HEAD:"$path")" = "$(git rev-parse 18ae65d85713cadc40cc00b87a44d3dba90ffdeb:"$path")"
          done
          test "$(git rev-parse HEAD:src/pages/index/index.vue)" = "$(git rev-parse f7ee7360e302d576dd4a44164592b5bcdf2c1b0e:src/pages/index/index.vue)"
          test "$(git rev-parse HEAD:src/features/session/login-consent.ts)" = "$(git rev-parse f7ee7360e302d576dd4a44164592b5bcdf2c1b0e:src/features/session/login-consent.ts)"
          test "$(git diff --name-only f7ee7360e302d576dd4a44164592b5bcdf2c1b0e HEAD -- pnpm-lock.yaml tests/ds02a-main/snapshots tests/ds02a-gallery/snapshots | wc -l)" -eq 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-r1-six-stage-parity.mjs
      - run: |
          pnpm exec vitest run tests/engineering/r1-manual-login-consent.test.ts tests/engineering/r1-appointment-wire-unification.test.ts tests/g4a/r1-manual-login-preflight.test.ts tests/g4d/accept-appointment.test.ts
      - run: pnpm verify:critical
      - run: pnpm verify:full
      - run: pnpm build:h5 && pnpm build:mp-weixin && pnpm build:app
  actual-h5-and-original-golden:
    if: github.event.pull_request.draft == true && github.event.pull_request.head.ref == 'engineering/r1-login-appointment-integrated-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VITE_XLINK_ENABLE_REAL_WRITES: 'false'
      H5_VISUAL_OWNER_APPROVAL: 'PENDING'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - run: pnpm exec playwright test --config playwright.main-h5-bootstrap.config.ts tests/h5-main-app/r1-manual-consent.spec.ts
      - run: pnpm exec playwright test --config playwright.main-h5-mock.config.ts tests/h5-main-mock/m1-i7-six-stage-integration.spec.ts
      - run: pnpm test:ds02a:gallery
      - run: pnpm test:ds02a:business
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-integrated-h5-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 20
