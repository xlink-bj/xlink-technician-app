name: R1 F2 Forms Repeat Transaction Contract (offline)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/r1-f2-multistep-transaction-gate.yml'
      - 'docs/engineering/R1_F2_MULTISTEP_TRANSACTION_FOUNDATION.md'
      - 'src/features/work-orders/r1-forms-exts-plan.ts'
      - 'src/features/work-orders/r1-multistep-offline-transaction.ts'
      - 'tests/engineering/r1-f2-multiform-transaction.test.ts'
permissions: {contents: read}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  transaction-contract-and-platform:
    if: github.event.pull_request.draft == true && github.event.pull_request.head.ref == 'feature/r1-f2-multiform-draft-transaction'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VITE_XLINK_ENVIRONMENT: test
      VITE_XLINK_ENABLE_REAL_WRITES: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check fixed F1 parent and exactly scoped edits
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor 414bac272ccfa14880626515864aa8b3dd921731 HEAD
          git diff --name-only 414bac272ccfa14880626515864aa8b3dd921731 HEAD | sort > /tmp/actual
          printf '%s\n' '.github/workflows/r1-f2-multistep-transaction-gate.yml' 'docs/engineering/R1_F2_MULTISTEP_TRANSACTION_FOUNDATION.md' 'src/features/work-orders/r1-forms-exts-plan.ts' 'src/features/work-orders/r1-multistep-offline-transaction.ts' 'tests/engineering/r1-f2-multiform-transaction.test.ts' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          test "$(git diff --name-only 414bac272ccfa14880626515864aa8b3dd921731 HEAD -- pnpm-lock.yaml src/adapters/api/technician-api-commands.ts src/adapters/api/uni-api-command-transport.ts | wc -l)" -eq 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/engineering/r1-f2-multiform-transaction.test.ts tests/engineering/r1-f1-existing-form-list.test.ts tests/engineering/r1-a06a-durable-write-fence.test.ts
      - run: pnpm verify:critical
      - run: pnpm verify:full
      - run: pnpm build:h5 && pnpm build:mp-weixin && pnpm build:app
  unchanged-mock-and-goldens:
    if: github.event.pull_request.draft == true && github.event.pull_request.head.ref == 'feature/r1-f2-multiform-draft-transaction'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      VITE_XLINK_ENVIRONMENT: test
      VITE_XLINK_ENABLE_REAL_WRITES: 'false'
      H5_VISUAL_OWNER_APPROVAL: 'PENDING'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - run: pnpm exec playwright test --config config/playwright/main-h5-mock.config.ts tests/h5-main-mock/m1-i7-six-stage-integration.spec.ts
      - run: pnpm test:ds02a:gallery
      - run: pnpm test:ds02a:business
