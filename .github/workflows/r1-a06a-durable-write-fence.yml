name: R1 A06-A durable FormData and Workflow fence (offline)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/r1-a06a-durable-write-fence.yml'
      - 'src/adapters/api/technician-api-commands.ts'
      - 'src/features/work-orders/action-mutation-receipt.ts'
      - 'src/features/work-orders/action-workspace.ts'
      - 'src/shared/ports/commands.ts'
      - 'src/shared/ports/index.ts'
      - 'tests/engineering/r1-a06a-durable-write-fence.test.ts'
      - 'tests/engineering/eq07-command-state-consistency.test.ts'
      - 'tests/engineering/r1-appointment-wire-unification.test.ts'
      - 'tests/g4d/accept-appointment.test.ts'
      - 'tests/g4d/action-workspace.test.ts'
      - 'tests/g4d/final-correction.test.ts'
      - 'tests/g4e/onsite-inspection.test.ts'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source-and-platform-regression:
    if: github.event.pull_request.draft == true && github.event.pull_request.head.ref == 'codex/r1-a06a-durable-write-fence'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VITE_XLINK_ENVIRONMENT: test
      VITE_XLINK_ENABLE_REAL_WRITES: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact Draft C3 ancestor and immutable business boundaries
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor 3c75b12faf77f26a369fc3619dc292f748df62d1 HEAD
          test "$(git diff --name-only 3c75b12faf77f26a369fc3619dc292f748df62d1 HEAD -- src/pages src/runtimes pnpm-lock.yaml tests/ds02a-main/snapshots tests/ds02a-gallery/snapshots | wc -l)" -eq 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Durable unknown and command order negative cases
        run: pnpm exec vitest run tests/engineering/r1-a06a-durable-write-fence.test.ts tests/engineering/eq07-command-state-consistency.test.ts tests/engineering/r1-appointment-wire-unification.test.ts
      - run: pnpm verify:critical
      - run: pnpm verify:full
      - run: pnpm build:h5 && pnpm build:mp-weixin && pnpm build:app
  original-mock-journey-and-goldens:
    if: github.event.pull_request.draft == true && github.event.pull_request.head.ref == 'codex/r1-a06a-durable-write-fence'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      VITE_XLINK_ENVIRONMENT: test
      VITE_XLINK_ENABLE_REAL_WRITES: 'false'
      H5_VISUAL_OWNER_APPROVAL: 'PENDING'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - run: pnpm exec playwright test --config config/playwright/main-h5-mock.config.ts tests/h5-main-mock/m1-i7-six-stage-integration.spec.ts
      - run: pnpm test:ds02a:gallery
      - run: pnpm test:ds02a:business
